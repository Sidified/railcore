[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railcore"
version = "0.4.0"
description = "A reservation engine modelled on Indian Railways booking, charting and refund rules"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
railcore = "railcore.cli:main"

[tool.setuptools.packages.find]
include = ["railcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
